			:root {
				/* Expose the platform safe-area insets as CSS custom properties so
				   the wasm host can read env(safe-area-inset-*) (which is not
				   script-readable directly) off the computed style of <html> and
				   feed the core-owned SafeArea global. */
				--sai-top: env(safe-area-inset-top, 0px);
				--sai-right: env(safe-area-inset-right, 0px);
				--sai-bottom: env(safe-area-inset-bottom, 0px);
				--sai-left: env(safe-area-inset-left, 0px);
			}
			html,
			body {
				margin: 0;
				padding: 0;
				width: 100%;
				height: 100%;
				/* No page scroll / white gutters: the shell fills the viewport and
				   the wasm host keeps the canvas sized to it (resize + rotation). */
				overflow: hidden;
				/* Brand espresso (palette.json brand.espresso = #3B281B): the same
				   backplate as the splash below and the in-shell BootSplash, so
				   overscroll regions and the pre-splash flash show no foreign color
				   (was #0b0b0f). */
				background: #3b281b;
				color: #e6e6f0;
				font-family: system-ui, sans-serif;
			}
			/* Slint's winit backend (web) binds to an existing element with
			   id="canvas" (see i-slint-backend-winit winitwindowadapter.rs:
			   get_element_by_id("canvas")). It must exist before start().
			   The wasm host drives the real size via window.set_size(); these
			   fallbacks only cover the pre-wasm paint (winit then sets an inline
			   width/height that governs). Sized in dvh so the initial paint tracks
			   the dynamic viewport (mobile address bar) rather than a locked vh. */
			#canvas {
				display: block;
				width: 100vw;
				width: 100dvw;
				height: 100vh;
				height: 100dvh;
				outline: none;
				touch-action: none;
			}
			/* -- Instant host-page splash (add-splash-screen, link 1 of 3) --------
			   Pure HTML/CSS, zero JS, zero extra network: the cream lockup SVG is
			   inlined below (payload mirrored from
			   crates/ui/assets/brand/robusta-lockup-mono-cream.svg), so this renders
			   with the first HTML paint and covers the wasm fetch/instantiate
			   window. The composition (espresso backplate + centered cream lockup)
			   matches the in-shell BootSplash so the host->shell handoff shows no
			   jump. The platform glue (platforms/web/app/src/lib.rs) removes it
			   after the shell paints its first frame — the ONLY script that touches
			   it; this markup decides nothing. */
			#splash {
				position: fixed;
				inset: 0;
				z-index: 2147483647;
				display: flex;
				align-items: center;
				justify-content: center;
				/* Brand espresso backplate — identical to the page + BootSplash. */
				background: #3b281b;
			}
			#splash svg {
				/* Match the BootSplash sizing rule: scale with the viewport, clamped
				   to the brand-book minimum (140px) and a comfortable maximum, so
				   the clearspace around the lockup is always honored. */
				width: min(50vw, 420px);
				height: auto;
			}
			/* Dismissal: the glue adds `.hidden` after the shell's first frame. The
			   fade is gated on `prefers-reduced-motion: no-preference`; with reduced
			   motion there is no transition and the element hides instantly. */
			#splash.hidden {
				opacity: 0;
				pointer-events: none;
			}
			@media (prefers-reduced-motion: no-preference) {
				#splash {
					transition: opacity 200ms ease-out;
				}
			}
		</style>
